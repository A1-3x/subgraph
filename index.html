52", "center_lon": -82.0750695, "center_lat": 33.37394019999999, "extraction_note": "neighborhood follows directed one-way restrictions"}, "note": "This is the extracted subgraph only, not the full study-area graph.", "basemap": {"cx": -9136847.413260698, "cy": 3944569.00388397, "k": 0.5457933947933732}};
  const MORPH_MS = 1400;
  const nodes = new vis.DataSet(DATA.nodes);
  const edges = new vis.DataSet(DATA.edges);
  const network = new vis.Network(document.getElementById("graph"), {nodes, edges}, {
    layout: {randomSeed: 42},
    physics: {
      enabled: true,
      barnesHut: {gravitationalConstant: -4000, springLength: 95, avoidOverlap: 0.3},

    edges: {smooth: {type: "continuous", roundness: 0.15}, arrows: {to: {scaleFactor: 0.25}}},
    nodes: {shape: "dot", font: {size: 12}}
  });
  document.getElementById("stats").innerHTML =
    `method: ${DATA.stats.method}<br>radius: ${DATA.stats.radius}<br>` +
    `nodes: ${DATA.stats.n_nodes}<br>directed edges: ${DATA.stats.n_edges}<br>` +
    `road length: ${(DATA.stats.total_length_km||0).toFixed(2)} km<br>${DATA.note}`;

  const BM = DATA.basemap;
  const mapEl = document.getElementById("map");
  const map = L.map(mapEl, {
    zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoom: false, zoomSnap: 0,
    zoomAnimation: false, fadeAnimation: false, minZoom: 0, maxZoom: 24
  }).setView([0, 0], 2);

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
    maxNativeZoom: 19, maxZoom: 24,
    attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, USGS, NGA, OpenStreetMap contributors"
  }).addTo(map);
  // Graph world units are Web Mercator metres scaled by BM.k around (BM.cx, BM.cy).
  function syncMap() {
    const p = network.getViewPosition(), s = network.getScale();
    const center = L.Projection.SphericalMercator.unproject(
      L.point(p.x / BM.k + BM.cx, -p.y / BM.k + BM.cy));
    const zoom = Math.log2(s * BM.k * 2 * Math.PI * 6378137 / 256);
    map.setView(center, zoom, {animate: false});
  }
  network.on("afterDrawing", syncMap);

  const button = document.getElementById("morph");
  const scrub = document.getElementById("scrub");
  const ids = DATA.nodes.map(n => n.id);
  const GEO = Object.fromEntries(DATA.nodes.map(n => [n.id, {x: n.x, y: n.y}]));
  let FORCE = null;
  let t = 0;
  let frameId = null;

  function bbox(pos) {
    const xs = ids.map(id => pos[id].x), ys = ids.map(id => pos[id].y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    return {cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, span: Math.max(x1 - x0, y1 - y0, 1e-6)};
  }

  // Rescale the force layout onto the geographic layout's footprint so the camera can stay put.
  function matchFootprint(pos) {
    const a = bbox(pos), b = bbox(GEO), k = b.span / a.span;
    return Object.fromEntries(ids.map(id => [id, {
      x: b.cx + (pos[id].x - a.cx) * k,
      y: b.cy + (pos[id].y - a.cy) * k
    }]));
  }

  const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

  function setT(value) {
    t = value;
    const e = ease(t);
    ids.forEach(id => {
      const a = FORCE[id], b = GEO[id];
      network.moveNode(id, a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e);
    });
    mapEl.style.opacity = e * e;
    scrub.value = Math.round((1 - t) * 1000);
    button.textContent = t < 0.5 ? "Morph to geographic layout" : "Morph to force-directed layout";
    network.redraw();
  }

  function animateTo(target) {
    if (frameId !== null) cancelAnimationFrame(frameId);
    const from = t, duration = MORPH_MS * Math.abs(target - from), t0 = performance.now();
    if (duration === 0) return;
    const step = now => {
      const u = Math.min(1, (now - t0) / duration);
      setT(from + (target - from) * u);
      frameId = u < 1 ? requestAnimationFrame(step) : null;
    };
    frameId = requestAnimationFrame(step);
  }

  network.once("stabilizationIterationsDone", () => {
    network.setOptions({physics: {enabled: false}});
    FORCE = matchFootprint(network.getPositions(ids));
    setT(1);
    network.fit({animation: false});
    button.disabled = false;
    scrub.disabled = false;
  });
  button.onclick = () => animateTo(t < 0.5 ? 1 : 0);
  scrub.oninput = () => {
    if (frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
    setT(1 - scrub.value / 1000);
  };
